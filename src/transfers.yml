# Tech transfers / shipped products, shown as cards after News.
# Use time spans rather than exact dates; long-running items can keep growing.
#   name, span, text (HTML), bullets: [HTML, ...] (optional list), links: [[label, url], ...],
#   image (optional), fit: contain (optional, for wide images)
# CV (build.py --cv-dir): cards with `cv: highlight` get a full entry; everything else is listed by its
#   `short` name on one "Other transfers" line. Bullets can be plain HTML or {text: ..., short: ...}.
# Draft wording and spans; please review.

- name: Semantic Search in Express and Stock
  span: 2023 – present
  cv: highlight
  image: images/transfers/stock-search.jpg
  text: >-
    Natural-language and image search for templates in Adobe Express (+46% click-through) and for
    assets in Adobe Stock. It has since grown to multilingual, behavior-tuned, and steerable search,
    and now runs on a new generation of our foundation model.
  links:
    - [Adobe Express, https://express.adobe.com/]
    - [Adobe Stock, https://stock.adobe.com/]

- name: Lightroom Natural-Language Search
  span: 2025 – present
  cv: highlight
  image: images/transfers/lightroom-search.jpg
  text: >-
    Search a photo library with full phrases like "photos of dog taken at the beach", with no keywords
    needed. Launched in Lightroom on the web, then in Lightroom desktop and mobile.
  links:
    - [Lightroom, https://lightroom.adobe.com/]
    - [Help article, https://helpx.adobe.com/lightroom/web/create-albums-and-organize-photos/add-and-organize-photos/semantic-search.html]
    - [Tutorial, https://www.adobe.com/learn/lightroom-cc/web/find-photos-natural-language-search]

- name: Adobe Firefly Image Generation
  span: 2023 – 2025

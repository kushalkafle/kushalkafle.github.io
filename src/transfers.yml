- name: Adobe Express and Adobe Stock
  span: 2023 – present
  highlight: true
  text-resume: Natural-language and image search for Express templates (+46% click-through) and Stock assets; "More like this" template similarity
  image: images/transfers/stock-search.jpg
  text: >-
    Natural-language and image search for templates in Adobe Express (+46% click-through) and for
    assets in Adobe Stock, plus "More like this" template similarity in Express. Search has since grown
    to multilingual, behavior-tuned, and steerable, and now runs on a new generation of our foundation model.
  links:
    - [Adobe Express, https://express.adobe.com/]
    - [Adobe Stock, https://stock.adobe.com/]

- name: Adobe Lightroom
  span: 2025 – present
  highlight: true
  text-resume: Natural-language photo search, plus assisted culling and Auto Stack via a compact on-device model
  image: images/transfers/lightroom-search.jpg
  text: >-
    Natural-language search of photo libraries with full phrases like "photos of dog taken at the beach",
    no keywords needed, plus <a href="https://helpx.adobe.com/lightroom-cc/using/assisted-culling.html">assisted culling</a>
    and <a href="https://helpx.adobe.com/lightroom-classic/help/auto-stack.html">Auto Stack</a> via a compact
    on-device model.
  links:
    - [Lightroom, https://lightroom.adobe.com/]
    - [Help article, https://helpx.adobe.com/lightroom/web/create-albums-and-organize-photos/add-and-organize-photos/semantic-search.html]
    - [Tutorial, https://www.adobe.com/learn/lightroom-cc/web/find-photos-natural-language-search]

- name: Adobe Firefly Image Generation
  span: 2023 – 2025
  highlight: true
  text-resume: Reference features in Firefly Image 1–3 (Style Reference, similar images); NSFW safety filter for image and video; training-data filtering
  image: images/transfers/firefly-style-reference.webp
  text: >-
    Firefly Image 1, 2, and 3 used our text and image encoders for their reference features, including
    Style Reference uploads, generating similar images, and using images as references. Our models also
    power Firefly's NSFW safety filter, used for both image and video generation, and the classifiers
    that filter its training data.
  links:
    - [Firefly, https://firefly.adobe.com/]


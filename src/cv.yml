interests: >-
  Multimodal LLMs / vision-language models (VLMs), representation learning, foundation model training on
  web-scale data, benchmarks, evaluation and model probing, robustness and fairness

transfers-intro: >-
  I lead Adobe's vision-language foundation models: image-text embedding models and, recently, multimodal
  LLMs / VLMs. Our embedding model matches or beats the best open-weight models (e.g., Perception Encoder,
  SigLIP 2) on text-to-image retrieval benchmarks, by a wider margin on Adobe content, and since 2023 has
  powered features across Adobe products:


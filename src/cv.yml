# CV content shared by the full CV (PDF), the 1-page resume (PDF), and the /cv web page.
# Papers come from pubs.bib, tech transfers from transfers.yml, talks from talks.yml,
# service from service.yml, and the intern count from interns.yml.
#
# Text may use simple HTML (<a href>, <em>, <strong>); it is converted for LaTeX.
# Variants (same rule in every data file): any field can have a `-cv` or `-resume` version
# (e.g. text-resume); `hide: [cv]` / `hide: [resume]` drops an item from that output.
# The /cv web page shows the cv version (with a toggle to the resume version).

name: Kushal Kafle
# Header title (the exact level, e.g. Senior Research Scientist 2, is listed under Experience).
title: Senior Research Scientist, Adobe Research
